name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: "3.11"
          - os: macos-14
            python: "3.12"
          - os: windows-2025
            python: "3.11"
          - os: windows-2025
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test tools
        run: python -m pip install --upgrade pip pytest build
      - name: Install Spilberg
        run: python -m pip install -e .
      - name: Validate public repository boundary
        run: python scripts/check_repository.py
      - name: Validate plugin, contracts and local smoke render
        run: python -m pytest -q
      - name: Build distributable package
        run: python -m build
