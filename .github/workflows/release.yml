name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Build package and SBOM
        run: |
          python -m pip install --upgrade pip build pip-audit
          python scripts/check_repository.py
          python -m build
          git archive --format=zip --output "dist/spilberg-agent-${GITHUB_REF_NAME}-source.zip" HEAD
          python -m pip_audit -r requirements/base.txt --format cyclonedx-json --output dist/SBOM.cdx.json
          python scripts/release_manifest.py
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest wheel SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/spilberg_agent-*.whl
          sbom-path: dist/SBOM.cdx.json
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/spilberg-agent-*-source.zip dist/*.whl dist/*.tar.gz dist/SHA256SUMS dist/SBOM.cdx.json dist/release-manifest.json --generate-notes
